# New Relic Java Agent configuration
# Customer API

common: &default_settings

  # Application name shown in New Relic APM
  app_name: Customer API

  # EU New Relic collector
  host: collector.eu.newrelic.com

  # Enable the Java agent
  agent_enabled: true

  # Agent logging
  log_level: info

  # Keep agent logs in the New Relic logs directory
  log_file_name: newrelic_agent.log

  # Transaction monitoring
  transaction_tracer:
    enabled: true

  # Error monitoring
  error_collector:
    enabled: true

  # Distributed tracing
  distributed_tracing:
    enabled: true

  # JVM/application metrics
  jvm:
    enabled: true

  # Application performance monitoring
  apdex_t: 0.5

# Test environment
test:
  <<: *default_settings

# Development environment
development:
  <<: *default_settings

# Staging environment
staging:
  <<: *default_settings

# Production environment
production:
  <<: *default_settings