apiVersion: apps/v1
kind: Deployment

metadata:
  name: customer-api

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: customer-api

  template:
    metadata:
      labels:
        app: customer-api

    spec:
      containers:

        - name: customer-api

          image: ghcr.io/bimbitha/customer-api:latest

          ports:
            - containerPort: 8080

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          env:
            - name: DB_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: customer-api-secret
                  key: DB_POSTGRES_PASSWORD

            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: customer-api-newrelic
                  key: NEW_RELIC_LICENSE_KEY

            - name: NEW_RELIC_APP_NAME
              value: "Customer API"

          envFrom:
            - configMapRef:
                name: customer-api-config