apiVersion: apps/v1
kind: Deployment

metadata:
  name: customer-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: customer-api

  template:
    metadata:
      labels:
        app: customer-api

    spec:
      containers:
        - name: customer-api
          image: ghcr.io/bimbitha/customer-api:latest

          ports:
            - containerPort: 8080

          env:
            - name: DB_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: customer-api-secret
                  key: DB_POSTGRES_PASSWORD

            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://host.docker.internal:5432/customer_db

            - name: SPRING_DATASOURCE_USERNAME
              value: postgres

    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
